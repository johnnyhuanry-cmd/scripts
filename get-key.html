
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripts | Get Key</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080a10;
      color: white;
      font-family: Arial, sans-serif;
    }

    .card {
      width: min(90%, 420px);
      padding: 35px;
      border: 1px solid #252b3a;
      border-radius: 20px;
      background: #111622;
      text-align: center;
      box-shadow: 0 0 40px #0008;
    }

    h1 { margin-top: 0; }

    p { color: #9ca8bd; }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      border: 0;
      border-radius: 10px;
      background: #6575ff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { background: #8290ff; }

    #result {
      margin-top: 18px;
      overflow-wrap: anywhere;
      color: #aab7ff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Scripts</h1>
    <p>Get your personal access key.</p>

    <button id="getKey">GET KEY</button>

    <div id="result"></div>
  </main>

  <script>
    document.getElementById("getKey").addEventListener("click", () => {
      document.getElementById("result").textContent =
        "Account verification is not connected yet.";
    });
  </script>
</body>
</html>
