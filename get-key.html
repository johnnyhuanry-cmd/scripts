
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripts | Get Key</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at top, #202d58, #080b14 70%);
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 90%;
  max-width: 430px;
  padding: 36px;
  text-align: center;
  background: #111827;
  border: 1px solid #35466f;
  border-radius: 22px;
  box-shadow: 0 0 45px #526fff25;
}

.logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 4px;
  color: #8ca2ff;
}

p { color: #9ba9c7; }

button {
  width: 100%;
  padding: 16px;
  margin-top: 20px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(90deg,#526fff,#9b65ff);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#result {
  margin-top: 22px;
  overflow-wrap: anywhere;
  color: #b8c5ff;
}

.small {
  margin-top: 28px;
  font-size: 12px;
  color: #667795;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">SCRIPTS</div>
  <h2>Get Your Access Key</h2>
  <p>Verify your Roblox account to receive a personal key.</p>

  <button id="getKey">GET KEY</button>

  <div id="result">Waiting for account verification.</div>

  <p class="small">Scripts Key System</p>
</div>

<script>
const button = document.getElementById("getKey");
const result = document.getElementById("result");

button.addEventListener("click", async () => {
  button.disabled = true;
  result.textContent = "Checking account verification...";

  try {
    const response = await fetch("/api/get-key", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({})
    });

    const data = await response.json();

    if (!response.ok) {
      result.textContent = data.error ||
        "Account verification is required.";
      return;
    }

    if (!data.success || !data.key) {
      result.textContent = data.error ||
        "Could not generate your key.";
      return;
    }

    await navigator.clipboard.writeText(data.key);
    result.textContent = "Your key was generated and copied!";
  } catch (error) {
    result.textContent = "Could not contact the key server.";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
