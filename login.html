
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripts | Admin Login</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #08070d;
  color: white;
  font-family: Arial, sans-serif;
}

.login {
  width: 100%;
  max-width: 410px;
  padding: 35px;
  background: #15111f;
  border: 1px solid #543276;
  border-radius: 20px;
  box-shadow: 0 0 40px #a855f722;
  animation: appear .6s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  text-align: center;
  color: #bd78ff;
  font-size: 30px;
  font-weight: 900;
  letter-spacing: 3px;
}

h1 {
  text-align: center;
  margin-top: 35px;
}

p {
  text-align: center;
  color: #999;
  font-size: 14px;
  margin-top: 10px;
}

label {
  display: block;
  margin: 23px 0 9px;
  color: #c58aff;
  font-size: 14px;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 9px;
  border: 1px solid #38234d;
  background: #08070d;
  color: white;
  outline: none;
}

input:focus {
  border-color: #bd78ff;
  box-shadow: 0 0 12px #a855f733;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: #a855f7;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  background: #c084fc;
  transform: translateY(-2px);
}

#message {
  color: #c58aff;
  margin-top: 18px;
  font-size: 13px;
}

.back {
  display: block;
  text-align: center;
  color: #999;
  margin-top: 25px;
  text-decoration: none;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="login">
  <div class="logo">SCRIPTS.</div>

  <h1>Admin Login</h1>
  <p>Sign in to manage your dashboard.</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="username"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      required
    >

    <button type="submit">SIGN IN</button>

    <p id="message"></p>
  </form>

  <a class="back" href="index.html">Back to Home</a>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  document.getElementById("message").textContent =
    "Login interface ready. Authentication still needs setup.";
});
</script>

</body>
</html>
