
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCRIPTS | Verify Key</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 50% 15%, #18265a, transparent 45%),
    #070912;
  color: white;
  font-family: Arial, sans-serif;
}

.card {
  width: 90%;
  max-width: 440px;
  padding: 38px 30px;
  text-align: center;
  background: rgba(17, 22, 42, .95);
  border: 1px solid #354b83;
  border-radius: 22px;
  box-shadow: 0 0 50px #526fff25;
  animation: appear .7s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.logo {
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 5px;
  color: #8da5ff;
  text-shadow: 0 0 20px #718aff;
}

.subtitle {
  color: #8795b8;
  font-size: 14px;
  margin-bottom: 28px;
}

input {
  width: 100%;
  padding: 15px;
  border-radius: 11px;
  border: 1px solid #354b83;
  background: #090e1e;
  color: white;
  outline: none;
  font-size: 14px;
  transition: .25s;
}

input:focus {
  border-color: #829aff;
  box-shadow: 0 0 18px #718aff40;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 17px;
  border: none;
  border-radius: 11px;
  color: white;
  font-weight: bold;
  letter-spacing: 1px;
  background: linear-gradient(90deg, #526fff, #a05cff);
  cursor: pointer;
  transition: .25s;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 25px #718aff80;
}

button:disabled {
  opacity: .55;
  cursor: wait;
  transform: none;
}

#result {
  min-height: 24px;
  margin-top: 23px;
  color: #aebdff;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.footer {
  margin-top: 30px;
  color: #586582;
  font-size: 11px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<div class="card">
  <div class="logo">SCRIPTS</div>
  <h2>Key Verification</h2>

  <p class="subtitle">
    Check the status of your access key.
  </p>

  <input
    id="key"
    type="text"
    placeholder="SCR-ENTER-YOUR-KEY"
    autocomplete="off"
  >

  <button id="verify">VERIFY KEY</button>

  <div id="result">Waiting for your key...</div>

  <div class="footer">SCRIPTS KEY SYSTEM</div>
</div>

<script>
const button = document.getElementById("verify");
const result = document.getElementById("result");
const input = document.getElementById("key");

button.addEventListener("click", async () => {
  const key = input.value.trim();

  if (!key) {
    result.textContent = "Please enter a key.";
    return;
  }

  button.disabled = true;
  button.textContent = "VERIFYING...";
  result.textContent = "Checking key status...";

  try {
    const response = await fetch("/api/verify-key", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ key })
    });

    const data = await response.json();

    if (data.valid === true) {
      result.textContent =
        "✓ KEY VALID — Expires: " +
        new Date(data.expiresAt).toLocaleDateString();
    } else {
      result.textContent =
        data.error || "Key is invalid.";
    }
  } catch (error) {
    result.textContent = "Could not contact verification server.";
  } finally {
    button.disabled = false;
    button.textContent = "VERIFY KEY";
  }
});
</script>
</body>
</html>
