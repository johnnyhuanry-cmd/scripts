
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scripts | Official</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #08070d;
  color: white;
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  width: 450px;
  height: 450px;
  background: #762aff;
  filter: blur(150px);
  opacity: .22;
  top: -180px;
  left: 50%;
  transform: translateX(-50%);
  pointer-events: none;
  animation: glow 5s infinite alternate;
}

@keyframes glow {
  from { opacity: .12; }
  to { opacity: .32; }
}

nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 25px 8%;
  border-bottom: 1px solid #ffffff15;
  position: relative;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 4px;
}

.logo span { color: #a66aff; }

nav a {
  color: #aaa;
  text-decoration: none;
  transition: .3s;
}

nav a:hover { color: #b77aff; }

main {
  min-height: 80vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 40px 20px;
}

.content {
  max-width: 650px;
  animation: appear 1s ease both;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.tag {
  display: inline-block;
  border: 1px solid #8b4aff66;
  background: #8b4aff15;
  color: #c29aff;
  padding: 10px 17px;
  border-radius: 30px;
  font-size: 11px;
  letter-spacing: 2px;
}

h1 {
  font-size: clamp(45px, 10vw, 80px);
  margin: 25px 0 12px;
  letter-spacing: -3px;
}

h1 span {
  background: linear-gradient(90deg,#a66aff,#e0c6ff,#8b4aff);
  background-size: 200%;
  color: transparent;
  background-clip: text;
  animation: gradient 4s linear infinite;
}

@keyframes gradient {
  to { background-position: 200% center; }
}

p {
  color: #9993a7;
  line-height: 1.8;
}

.button {
  display: inline-block;
  margin-top: 25px;
  padding: 16px 34px;
  background: linear-gradient(110deg,#762aff,#a35bff);
  border-radius: 10px;
  color: white;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 0 25px #8d40ff44;
  transition: .3s;
}

.button:hover {
  transform: translateY(-5px) scale(1.04);
  box-shadow: 0 0 40px #9a50ff99;
}

.cards {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 55px;
}

.card {
  width: 180px;
  padding: 22px 15px;
  border: 1px solid #ffffff15;
  border-radius: 14px;
  background: #ffffff08;
  transition: .3s;
}

.card:hover {
  transform: translateY(-8px);
  border-color: #a66aff;
  box-shadow: 0 10px 30px #8b4aff20;
}

.card strong {
  display: block;
  margin-bottom: 9px;
}

.card small { color: #928b9f; }

footer {
  text-align: center;
  color: #625b70;
  padding: 25px;
  border-top: 1px solid #ffffff10;
  font-size: 12px;
}

@media(max-width:450px) {
  .card { width: 100%; max-width: 280px; }
}
</style>
</head>
<body>

<nav>
  <div class="logo">SCRIPTS<span>.</span></div>
  <a href="#about">About</a>
</nav>

<main>
  <div class="content">
    <div class="tag">✦ OFFICIAL PORTAL</div>

    <h1>Welcome to <span>Scripts.</span></h1>

    <p>
      A modern home for your software.
      Built with simplicity, style and performance in mind.
    </p>

    <a class="button" href="dashboard.html">EXPLORE SCRIPTS ↗</a>

    <div class="cards" id="about">
      <div class="card">
        <strong>✦ Modern</strong>
        <small>Clean interface</small>
      </div>
      <div class="card">
        <strong>⚡ Fast</strong>
        <small>Smooth experience</small>
      </div>
      <div class="card">
        <strong>◈ Secure</strong>
        <small>Security focused</small>
      </div>
    </div>
  </div>
</main>

<footer>
  SCRIPTS © 2026 · ALL RIGHTS RESERVED
</footer>

</body>
</html>
