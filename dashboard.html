<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scripts Dashboard</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 35px 20px;
  background: #08070d;
  color: white;
  font-family: Arial, sans-serif;
}
main { max-width: 900px; margin: 60px auto; }
h1 { font-size: 45px; }
h1 span { color: #b56aff; }
.card {
  background: #15111f;
  border: 1px solid #58317a;
  border-radius: 16px;
  padding: 25px;
  margin-top: 25px;
  transition: .3s;
}
.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 25px #a855f755;
}
p { color: #aaa; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <h1>Scripts <span>Dashboard.</span></h1>
  <p>Welcome to your Scripts control center.</p>

  <div class="card">
    <h2>Key Management</h2>
    <p>Manage access keys for your own software.</p>
  </div>

  <div class="card">
    <h2>Key Status</h2>
    <p>Database connection coming next.</p>
  </div>
</main>
</body>
</html>
